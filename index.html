<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent Platform Case Gallery</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --panel: #ffffff;
      --ink: #171923;
      --muted: #5f6877;
      --line: #dfe4ed;
      --soft: #eef2f7;
      --accent: #1f6feb;
      --accent-2: #0f766e;
      --warn: #a16207;
      --shadow: 0 16px 40px rgba(23, 25, 35, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
    }

    .wrap {
      width: min(1440px, calc(100% - 48px));
      margin: 0 auto;
    }

    .hero {
      padding: 40px 0 30px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 980px;
      margin: 0;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .intro {
      max-width: 920px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .stat {
      min-height: 86px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .stat strong {
      display: block;
      font-size: 28px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      padding: 28px 0 54px;
    }

    .case {
      margin-top: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .case:first-child {
      margin-top: 0;
    }

    .case-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .case-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .case-path {
      margin-top: 7px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      word-break: break-all;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      min-width: 260px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .matrix {
      display: grid;
      grid-template-columns: minmax(260px, 1.05fr) minmax(280px, 1fr) minmax(280px, 1fr);
      gap: 0;
    }

    .cell {
      min-width: 0;
      padding: 18px;
      border-right: 1px solid var(--line);
    }

    .cell:last-child {
      border-right: 0;
    }

    .cell + .cell {
      background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }

    .cell-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      color: #2b3340;
      font-size: 13px;
      font-weight: 700;
    }

    .cell-title a {
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .media-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111827;
      aspect-ratio: 9 / 16;
    }

    video,
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 12px;
    }

    .asset {
      min-width: 0;
    }

    .asset .media-frame {
      background: #f8fafc;
      aspect-ratio: 1 / 1;
    }

    .filename {
      margin-top: 6px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .text-view {
      width: 100%;
      height: 210px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .text-view object {
      width: 100%;
      height: 100%;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }

    .text-stack {
      display: grid;
      gap: 14px;
    }

    .placeholder {
      display: grid;
      min-height: 160px;
      place-items: center;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
      padding: 18px;
      text-align: center;
      font-size: 14px;
    }

    .pending {
      color: var(--warn);
    }

    footer {
      padding: 22px 0 36px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1100px) {
      .matrix {
        grid-template-columns: 1fr;
      }

      .cell {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .cell:last-child {
        border-bottom: 0;
      }
    }

    @media (max-width: 760px) {
      .wrap {
        width: min(100% - 28px, 1440px);
      }

      .hero {
        padding-top: 28px;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .case-head {
        display: block;
      }

      .badges {
        justify-content: flex-start;
        min-width: 0;
        margin-top: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap hero">
      <p class="eyebrow">AI Agent Platform Evaluation</p>
      <h1>Test Data Case Gallery</h1>
      <p class="intro">按 case 汇总展示原始参考视频、user_input 图片素材与文本、生成结果视频和 prompt。输出文件请放在每个 case 的 <code>output/output.mp4</code> 与 <code>output/prompt.txt</code>。</p>
      <div class="stats" aria-label="case summary">
        <div class="stat"><strong id="caseCount">0</strong><span>Cases</span></div>
        <div class="stat"><strong id="videoCount">0</strong><span>Original videos</span></div>
        <div class="stat"><strong id="imageCount">0</strong><span>User input images</span></div>
        <div class="stat"><strong id="textCount">0</strong><span>User input text files</span></div>
      </div>
    </div>
  </header>

  <main class="wrap" id="cases"></main>

  <footer class="wrap">
    Relative data root: <code>../test_data</code>
  </footer>

  <script>
    const cases = [
      {
        name: "animal",
        root: "../test_data/animal",
        originalVideo: "2_2_case4-H3-original.mp4",
        inputImages: [],
        inputTexts: []
      },
      {
        name: "dance",
        root: "../test_data/dance",
        originalVideo: "2_2_case2-H3-original.mp4",
        inputImages: [],
        inputTexts: []
      },
      {
        name: "nail-5",
        root: "../test_data/nail-5",
        originalVideo: "nail-5.mp4",
        inputImages: ["user_input/shangpin-3.png"],
        inputTexts: ["user_input/requirement.txt"]
      },
      {
        name: "nail-6",
        root: "../test_data/nail-6",
        originalVideo: "nail-6.mp4",
        inputImages: ["user_input/shangpin-3.png"],
        inputTexts: ["user_input/requirement.txt"]
      },
      {
        name: "保鲜盒",
        root: "../test_data/保鲜盒",
        originalVideo: "竖屏-保鲜收纳-实拍-无台词_14s.mp4",
        inputImages: [],
        inputTexts: []
      },
      {
        name: "特仑苏",
        root: "../test_data/特仑苏",
        originalVideo: "竖版-特仑苏-实拍-无台词_15s.mp4",
        inputImages: ["user_input/东方树叶.jpg"],
        inputTexts: []
      }
    ];

    const fileName = path => path.split("/").pop();
    const mediaPath = (item, path) => `${item.root}/${path}`;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function videoBlock(src, label, pending = false) {
      const frame = el("div", "media-frame");
      const video = document.createElement("video");
      video.controls = true;
      video.preload = "metadata";
      video.src = src;
      video.setAttribute("playsinline", "");
      const fallback = el("div", "placeholder" + (pending ? " pending" : ""), pending ? "待添加 output.mp4" : "视频无法加载");
      fallback.hidden = true;
      video.addEventListener("error", () => {
        video.hidden = true;
        fallback.hidden = false;
      });
      frame.append(video, fallback);
      if (!label) return frame;
      const box = el("div", "asset");
      box.append(frame, el("div", "filename", label));
      return box;
    }

    function imageBlock(src, label) {
      const box = el("div", "asset");
      const frame = el("div", "media-frame");
      const image = document.createElement("img");
      image.src = src;
      image.alt = label;
      const fallback = el("div", "placeholder", "图片无法加载");
      fallback.hidden = true;
      image.addEventListener("error", () => {
        image.hidden = true;
        fallback.hidden = false;
      });
      frame.append(image, fallback);
      box.append(frame, el("div", "filename", label));
      return box;
    }

    function textBlock(src, label, pending = false) {
      const stack = el("div", "text-stack");
      const title = el("div", "filename", label);
      const frame = el("div", "text-view");
      const object = document.createElement("object");
      object.type = "text/plain";
      object.data = src;
      object.append(el("div", "placeholder" + (pending ? " pending" : ""), pending ? "待添加 prompt.txt" : "文本无法加载"));
      frame.append(object);
      stack.append(title, frame);
      return stack;
    }

    function titledCell(title, href) {
      const cell = el("section", "cell");
      const heading = el("div", "cell-title");
      heading.append(el("span", "", title));
      if (href) {
        const link = document.createElement("a");
        link.href = href;
        link.textContent = "Open";
        link.target = "_blank";
        link.rel = "noreferrer";
        heading.append(link);
      }
      cell.append(heading);
      return cell;
    }

    function renderCase(item, index) {
      const section = el("article", "case");
      const head = el("div", "case-head");
      const titleBox = el("div");
      titleBox.append(el("h2", "case-title", `${String(index + 1).padStart(2, "0")} · ${item.name}`));
      titleBox.append(el("div", "case-path", item.root));
      const badges = el("div", "badges");
      badges.append(el("span", "badge", "Original video"));
      badges.append(el("span", "badge", `${item.inputImages.length} input image(s)`));
      badges.append(el("span", "badge", `${item.inputTexts.length} input text(s)`));
      badges.append(el("span", "badge pending", "Output pending-aware"));
      head.append(titleBox, badges);

      const matrix = el("div", "matrix");
      const originalPath = mediaPath(item, item.originalVideo);
      const original = titledCell("Original video", originalPath);
      original.append(videoBlock(originalPath, item.originalVideo));

      const inputs = titledCell("User input assets", `${item.root}/user_input/`);
      if (!item.inputImages.length && !item.inputTexts.length) {
        inputs.append(el("div", "placeholder", "当前 case 未发现 user_input 图片或文本"));
      } else {
        if (item.inputImages.length) {
          const grid = el("div", "asset-grid");
          item.inputImages.forEach(path => grid.append(imageBlock(mediaPath(item, path), fileName(path))));
          inputs.append(grid);
        }
        if (item.inputTexts.length) {
          const texts = el("div", "text-stack");
          item.inputTexts.forEach(path => texts.append(textBlock(mediaPath(item, path), path)));
          inputs.append(texts);
        }
      }

      const output = titledCell("Output video and prompt", `${item.root}/output/`);
      output.append(videoBlock(mediaPath(item, "output/output.mp4"), "output/output.mp4", true));
      output.append(textBlock(mediaPath(item, "output/prompt.txt"), "output/prompt.txt", true));

      matrix.append(original, inputs, output);
      section.append(head, matrix);
      return section;
    }

    document.getElementById("caseCount").textContent = cases.length;
    document.getElementById("videoCount").textContent = cases.filter(item => item.originalVideo).length;
    document.getElementById("imageCount").textContent = cases.reduce((sum, item) => sum + item.inputImages.length, 0);
    document.getElementById("textCount").textContent = cases.reduce((sum, item) => sum + item.inputTexts.length, 0);

    const root = document.getElementById("cases");
    cases.forEach((item, index) => root.append(renderCase(item, index)));
  </script>
</body>
</html>
